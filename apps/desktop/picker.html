<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pick a region</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: crosshair; user-select: none; }
      #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.38); }
      #box { position: fixed; border: 2px solid #ffb600; background: rgba(255, 182, 0, 0.08); display: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.38); }
      #hint { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); color: #f7f7f5; background: #13151a; border: 1px solid #292c34; border-radius: 999px; padding: 8px 16px; font: 13px system-ui, sans-serif; letter-spacing: 0.04em; }
      #size { position: fixed; color: #f7f7f5; background: #13151a; border-radius: 4px; padding: 2px 6px; font: 12px ui-monospace, monospace; display: none; }
    </style>
  </head>
  <body>
    <div id="dim"></div>
    <div id="box"></div>
    <div id="size"></div>
    <div id="hint">Drag a rectangle to send to Screen Sense · Esc to cancel</div>
    <script>
      const dim = document.getElementById("dim");
      const box = document.getElementById("box");
      const size = document.getElementById("size");
      let start = null;
      const rect = (e) => {
        const x = Math.min(start.x, e.clientX), y = Math.min(start.y, e.clientY);
        return { x, y, width: Math.abs(e.clientX - start.x), height: Math.abs(e.clientY - start.y) };
      };
      window.addEventListener("mousedown", (e) => {
        start = { x: e.clientX, y: e.clientY };
        dim.style.display = "none";
        box.style.display = "block";
        size.style.display = "block";
      });
      window.addEventListener("mousemove", (e) => {
        if (!start) return;
        const r = rect(e);
        Object.assign(box.style, { left: r.x + "px", top: r.y + "px", width: r.width + "px", height: r.height + "px" });
        size.textContent = `${r.width} × ${r.height}`;
        Object.assign(size.style, { left: r.x + "px", top: Math.max(0, r.y - 22) + "px" });
      });
      window.addEventListener("mouseup", (e) => {
        if (!start) return;
        const r = rect(e);
        start = null;
        if (r.width < 8 || r.height < 8) return window.picker.cancel();
        window.picker.done(r);
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") window.picker.cancel();
      });
    </script>
  </body>
</html>
