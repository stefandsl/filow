name: Desktop builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:build:win
          - os: macos-latest
            script: desktop:build:mac
          - os: ubuntu-latest
            script: desktop:build:linux
    runs-on: ${{ matrix.os }}
    env:
      # macOS: no Apple identity on the runner. Windows signing happens automatically when the
      # WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD secrets exist; see README "Code signing".
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: intelliprompter-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
            release/*.zip
            !release/builder-debug.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
      # Auto-update feed: the same files on the PUBLIC releases repo (this repo is private, and an
      # installed app cannot read private releases). Needs the RELEASES_TOKEN secret; see README.
      - name: Publish to the public releases repo
        if: env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: stefandsl/intelliprompter-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Intelliprompter ${{ github.ref_name }}
          body: "Installers for Windows, macOS and Linux. Source: github.com/stefandsl/intelliprompter (private). The desktop app updates itself from here."
          files: artifacts/*
