name: Desktop builds

on:
  push:
    tags: ["v*"]
    # Every push to main runs the checks only; the build job below runs on tags and manual runs.
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build once, or an existing tag to smoke with smoke_only. Empty: build main as an artifact."
        required: false
        default: ""
      smoke_only:
        description: "Smoke the existing source installer only (no rebuild). Required before feed publication."
        type: boolean
        default: false
      os:
        description: "Build only this runner (macos-latest, windows-latest, ubuntu-latest) or all"
        required: false
        default: all

# Least privilege: build and manual smoke can attach assets to this source repository only.
permissions:
  contents: read

jobs:
  # The same commands as the local merge gate (G:\FILOW\tmp\orchestrator\merge-gate.ps1), once, on
  # Windows (where the suite is developed and checked). Any red step fails the job, and no installer is
  # built while it is red. Every external action is pinned to a full commit SHA (the tag in the comment);
  # tools/release/workflows.test.ts fails on one that is not.
  checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag || github.ref }} # the same source the build job packages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline
      - name: Verify before building a release
        if: ${{ !inputs.smoke_only && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          $version = $env:RELEASE_TAG.Substring(1)
          node tools/release/release-verify.mjs preflight --version $version --state "$env:RUNNER_TEMP/preflight.json"
          if ($LASTEXITCODE -ne 0) { throw 'Release preflight failed' }
      - run: node node_modules/electron/install.js
      - run: npm run vendor -w apps/desktop
      # The tests run without the generated dictionary bundle, as the merge gate does.
      - name: Remove the generated dictionary bundle
        shell: pwsh
        run: if (Test-Path apps\desktop\vendor\i18n.js) { Remove-Item apps\desktop\vendor\i18n.js }
      - run: npx vitest run
      - run: npm run build:welcome -w apps/desktop
      - run: npm run typecheck
      - run: npm run lint

  # Installers only for a pushed tag or a manual run; a push to main stops after the checks.
  build:
    needs: checks
    if: ${{ !inputs.smoke_only && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:build:win
          - os: macos-latest
            script: desktop:build:mac
          - os: ubuntu-latest
            script: desktop:build:linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # macOS: no Apple identity on the runner. Windows signing happens automatically when the
      # WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD secrets exist; see README "Code signing".
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # A manual run can be limited to one runner; the other jobs then skip every step.
      HERE: ${{ github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == '' || inputs.os == matrix.os }}
      # The release this run attaches to: the pushed tag, or a manual run's release_tag (empty: none).
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.HERE == 'true'
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.HERE == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HERE == 'true'
      # The macOS runner is Apple Silicon, so npm installs only sherpa-onnx-darwin-arm64; the Intel build
      # needs sherpa-onnx-darwin-x64 too (after-pack.js stops a build without it). It is unpacked from the
      # registry at the version package-lock.json pins (npm pack checks its integrity), not npm-installed
      # with --cpu=x64, which could prune the arm64 packages.
      - name: Add the Intel speech-to-text package (macOS)
        if: env.HERE == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/sherpa-onnx-darwin-x64'].version")
          tmp=$(mktemp -d)
          npm pack "sherpa-onnx-darwin-x64@$v" --pack-destination "$tmp"
          mkdir -p node_modules/sherpa-onnx-darwin-x64
          tar -xzf "$tmp"/sherpa-onnx-darwin-x64-*.tgz -C node_modules/sherpa-onnx-darwin-x64 --strip-components=1
          ls node_modules/sherpa-onnx-darwin-x64
      - run: npm run typecheck
        if: env.HERE == 'true'
      # About shows which commit the installer was made from: the sha is written into the desktop
      # package.json that electron-builder packs (apps/desktop/main.js reads it as sourceSha).
      - name: Record the commit in the desktop package
        if: env.HERE == 'true'
        shell: bash
        run: npm pkg set sourceSha=$(git rev-parse HEAD) -w apps/desktop
      - run: npm run ${{ matrix.script }}
        if: env.HERE == 'true'
      # electron-builder's own debug file is not for users. The release action ignores "!" patterns
      # (0.9.30 and 0.9.31 carry it), so it is removed before anything is attached.
      - name: Drop builder-debug.yml
        if: env.HERE == 'true'
        shell: bash
        run: rm -f release/builder-debug.yml
      # Tag builds attach the installers straight to the GitHub release: no artifact storage in
      # between (the Actions storage quota blocked releases before). Each OS job uploads its own files;
      # softprops reuses the release that the first job created for the tag.
      - name: Attach installers to the release
        if: env.HERE == 'true' && env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
            release/*.zip
            !release/builder-debug.yml
          generate_release_notes: true
      # Manual runs without a release_tag keep the installers as a short-lived artifact instead.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.HERE == 'true' && env.RELEASE_TAG == ''
        continue-on-error: true
        with:
          name: filow-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
            release/*.zip
            !release/builder-debug.yml
          if-no-files-found: error
          retention-days: 1

  # Manual only until validated on a clean runner. Uses the default token, never the feed token.
  # The publisher compares this installer's digest with the actual draft before making it public.
  smoke:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_only && inputs.release_tag != ''
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag }}
      - name: Install and launch Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          $v = $env:RELEASE_TAG.Substring(1)
          $dir = Join-Path $env:RUNNER_TEMP 'release-smoke'
          New-Item -ItemType Directory $dir | Out-Null
          gh release download $env:RELEASE_TAG -R stefandsl/filow --pattern "Filow-$v-win-x64.exe" -D $dir
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          $sha = git rev-parse HEAD
          ./tools/release/smoke-windows.ps1 -Installer "$dir/Filow-$v-win-x64.exe" -SourceSha $sha -Result "$dir/smoke-result.json"
          gh release upload $env:RELEASE_TAG -R stefandsl/filow "$dir/smoke-result.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Smoke evidence upload failed' }
