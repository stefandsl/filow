name: Desktop builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Lint, types and the unit tests, once, on Windows (where the suite is developed and checked).
  # No installer is built while they are red.
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:build:win
          - os: macos-latest
            script: desktop:build:mac
          - os: ubuntu-latest
            script: desktop:build:linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      # macOS: no Apple identity on the runner. Windows signing happens automatically when the
      # WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD secrets exist; see README "Code signing".
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run ${{ matrix.script }}
      # Tag builds attach the installers straight to the GitHub release: no artifact storage in
      # between (the Actions storage quota blocked releases before). Each OS job uploads its own files;
      # softprops reuses the release that the first job created for the tag.
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
            release/*.zip
            !release/builder-debug.yml
          generate_release_notes: true
      # Auto-update feed: the same files on the separate releases repo, which the installed apps read
      # (electron-builder publish config). Needs the RELEASES_TOKEN secret; see README.
      - name: Publish to the public releases repo
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: stefandsl/filow-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Filow ${{ github.ref_name }}
          body: "Installers for Windows, macOS and Linux. Source: github.com/stefandsl/filow. The desktop app updates itself from here."
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
            release/*.zip
            !release/builder-debug.yml
      # Manual runs (no tag) keep the installers as a short-lived artifact instead.
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        continue-on-error: true
        with:
          name: filow-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
            release/*.zip
            !release/builder-debug.yml
          if-no-files-found: error
          retention-days: 1
